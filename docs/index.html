  <body>
    <!-- React Root -->
    <div id="root"></div>

    <!-- Network Info Card (Floating) -->
    <div id="network-card"
      style="
        position: fixed;
        bottom: 20px;
        right: 20px;
        width: 340px;
        padding: 16px;
        border-radius: 16px;
        background: #0f172a;
        color: #e5e7eb;
        font-family: system-ui;
        box-shadow: 0 20px 40px rgba(0,0,0,.3);
        z-index: 9999;
      "
    >
      <h3 style="margin:0 0 10px;">🌐 Network Quality</h3>
      <div id="net-score" style="font-size:36px;font-weight:700;">…</div>
      <div id="net-label">Detecting…</div>
      <hr style="opacity:.2" />
      <div id="net-details" style="font-size:14px;line-height:1.6;">Measuring…</div>
    </div>

    <!-- React Entry Script (Vite) -->

    <!-- Universal Network Detection Script -->
    <script>
      async function measureBandwidthFallback() {
        const testFile = "/bandwidth-test.txt?cache=" + Date.now();
        const start = performance.now();
        try {
          const res = await fetch(testFile, { cache: "no-store" });
          const blob = await res.blob();
          const end = performance.now();
          const seconds = (end - start)/1000;
          const bits = blob.size * 8;
          const mbps = (bits / seconds / 1024 / 1024).toFixed(2);
          return { supported: true, downlink: Number(mbps), method: "Live Test" };
        } catch {
          return { supported: false };
        }
      }

      async function getNetworkInfo() {
        const c = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
        if (c && c.downlink) {
          return {
            supported: true,
            downlink: c.downlink,
            rtt: c.rtt || null,
            effectiveType: c.effectiveType || "unknown",
            saveData: c.saveData || false,
            method: "Browser API"
          };
        }
        return await measureBandwidthFallback();
      }

      function calculateScore(speed) {
        if (!speed) return { score: 0, label: "Unknown" };
        const score = Math.min(100, Math.round(speed * 10));
        const label =
          score >= 80 ? "Excellent" :
          score >= 60 ? "Good" :
          score >= 40 ? "Fair" : "Poor";
        return { score, label };
      }

      async function updateNetworkUI() {
        const scoreEl = document.getElementById("net-score");
        const labelEl = document.getElementById("net-label");
        const detailsEl = document.getElementById("net-details");
        if (!scoreEl) return;

        const info = await getNetworkInfo();

        if (!info.supported) {
          scoreEl.textContent = "—";
          labelEl.textContent = "Unavailable";
          detailsEl.textContent = "Network measurement failed.";
          return;
        }

        const result = calculateScore(info.downlink);

        scoreEl.textContent = result.score;
        labelEl.textContent = result.label;
        labelEl.style.color =
          result.score >= 80 ? "#22c55e" :
          result.score >= 60 ? "#38bdf8" :
          result.score >= 40 ? "#facc15" : "#ef4444";

        detailsEl.innerHTML = `
          <strong>Speed:</strong> ${info.downlink} Mbps<br/>
          <strong>Method:</strong> ${info.method}
        `;
      }

      window.addEventListener("load", updateNetworkUI);
    </script>
